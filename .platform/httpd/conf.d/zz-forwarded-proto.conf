# The ALB terminates TLS and forwards plain HTTP with X-Forwarded-Proto. Mark the request
# as HTTPS for PHP so Laravel builds https URLs (what heroku-php-apache2 did on Heroku).
# https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/platforms-linux-extend.proxy.html
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
